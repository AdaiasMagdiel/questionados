# .github/workflows/deploy.yml
name: Deploy to deta space

# Deta Space was discontinued; kept as a historical record and disabled
# (manual trigger only) so it doesn't fail automatically.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to deta space
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Deploy
      uses: lizheming/deta-action@master
      with:
        access_token: ${{ secrets.space_access_token }}
        id: ${{ secrets.space_id }}
        version: "1.0.0"
        notes: "Release automatically with GitHub deta action"
        listed: false
